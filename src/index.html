<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarnished House</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="modal" id="loading-screen">
      <div id="intro-modal">
        <div class="modal-content-wrapper">
          <div class="modal-content">
            <p id="intro-text"></p>
          </div>
        </div>
      </div>
      <div id="loader" class="loader">
        <div class="loader-content">
          <div class="spinner"></div>
          <div class="loading-text">Loading...</div>
        </div>
      </div>
      <div class="enter-container">
        <button id="enter-scene" class="btn">Enter</button>
      </div>
    </div>
    <div id="btn-container" class="btn-container hidden">
      <button class="btn" id="settings-btn">Settings</button>
      <button class="btn" id="credits-btn">Credits</button>
      <button class="btn" id="sound-toggle-btn" aria-label="Toggle sound">
        <img id="sound-toggle-icon" src="/sound-off.svg" alt="Sound off" />
      </button>
      <button class="btn" id="photo-shot">
        <img id="photo-icon" src="/photo.svg" alt="photo-shot" />
      </button>
    </div>
    <div class="modal hidden" id="settings-modal">
      <div class="modal-content-wrapper">
        <div class="modal-content">
          <div class="header">
            <h2>Settings</h2>
            <span id="close-settings" class="close-modal">&times;</span>
          </div>
          <div class="inner-content settings-content" id="settings"></div>
        </div>
      </div>
    </div>
    <div class="modal hidden" id="credits-modal">
      <div class="modal-content-wrapper">
        <div class="modal-content">
          <div class="header">
            <h2>Credits</h2>
            <span id="close-credits" class="close-modal">&times;</span>
          </div>
          <div class="inner-content credits-content">
            <p id="credits-text"></p>
            <div class="credits-footer" id="credits-footer">
              <span class="license-normal"
                >GNU General Public License (GPL)</span
              >
              <div class="logos">
                <a
                  href="https://github.com/0x74h51N/tarnished-house"
                  target="_blank"
                  class="tooltip"
                >
                  <img src="./github.svg" alt="Github Repo" />
                  <span class="tooltiptext">Source Code</span>
                </a>
                <br />
                <a
                  href="https://crunchypix.com"
                  target="_blank"
                  class="tooltip"
                >
                  <img src="./web.svg" alt="Webpage" height="40px" />
                  <span class="tooltiptext">Creator Webpage</span>
                </a>
              </div>
            </div>
          </div>
          <h2 style="margin-top: 2rem">Assets</h2>
          <ul class="asset-list" id="asset-list"></ul>
        </div>
      </div>
    </div>
    <canvas class="webgl"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
